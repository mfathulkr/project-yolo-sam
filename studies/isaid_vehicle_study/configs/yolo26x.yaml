dataset:
  name: isaid_vehicle
  target_categories:
    - Small_Vehicle
    - Large_Vehicle
  merged_category: vehicle
  train_split: train
  val_split: val
  eval_split: eval
  tile_size: 1024
  stride: 1024
  include_edge_tiles: true
  tile_image_format: jpg
  min_instance_area: 12
  train_negative_ratio: 0.5
  sampling_seed: 42

paths:
  raw_dataset_dir: datasets/isaid/raw
  prepared_dataset_dir: studies/isaid_vehicle_study/data/prepared
  yolo_train_run_dir: studies/isaid_vehicle_study/results/detector_training/yolo26x_isaid_vehicle_s1024
  sam3_text_output_dir: studies/isaid_vehicle_study/results/pipelines/sam3_text
  yolo_sam3_output_dir: studies/isaid_vehicle_study/results/pipelines/yolo26x_sam3
  gt_box_sam3_output_dir: studies/isaid_vehicle_study/results/pipelines/gt_box_sam3
  sam3_triplet_metrics_dir: studies/isaid_vehicle_study/results/pipelines/metrics_sam3_triplet
  sam3_triplet_visualizations_dir: studies/isaid_vehicle_study/results/pipelines/visualizations_sam3_triplet

yolo:
  base_weights: models/yolo/yolo26x.pt
  trained_weights: studies/isaid_vehicle_study/results/detector_training/yolo26x_isaid_vehicle_s1024/train/weights/best.pt
  imgsz: 1024
  batch: 32
  epochs: 100
  patience: 30
  conf: 0.20
  iou: 0.70
  max_det: 500
  workers: 4
  device: "0,1,2,3"

sam3:
  backend: local
  local_model_dir: models/sam3_hf
  prompt: vehicle
  output_prob_thresh: 0.5
  mask_threshold: 0.5
  device: 0
  torch_dtype: float16
  endpoint: https://serverless.roboflow.com/sam3/concept_segment
  model_id: sam3/sam3_final

evaluation:
  positive_only: true
  stratify_by: object_count
  min_objects_per_image: 1
  max_objects_per_image: 500
  low_object_count_max: 5
  high_object_count_min: 20
  overlap_iou_threshold: 0.0
  no_overlap_iou_max: 0.0
  overlap_iou_min: 0.05
  area_threshold: median
  max_per_stratum: 32
  balance_to_smallest_stratum: true
  max_visualizations: 24
  max_visualizations_per_stratum: 3

training_time_reference:
  baseline_seconds_per_epoch: 66.1
  baseline_train_images: 2370
  baseline_imgsz: 640
  baseline_gflops: 28.8
  target_gflops: 209.5
