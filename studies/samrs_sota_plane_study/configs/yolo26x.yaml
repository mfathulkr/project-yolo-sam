dataset:
  name: samrs_sota_plane
  target_categories:
    - plane
  merged_category: plane
  train_split: train
  val_split: val
  eval_split: eval
  mask_subdir: rhbox_segs_init/ins
  tile_image_format: png
  min_instance_area: 8
  train_negative_ratio: 0.25
  sampling_seed: 42
  annotation_note: SAMRS SOTA masks are SAM-generated pseudo-labels from DOTA v2.0 detections.

paths:
  raw_dataset_dir: datasets/samrs/raw/sota
  prepared_dataset_dir: studies/samrs_sota_plane_study/data/prepared
  yolo_train_run_dir: studies/samrs_sota_plane_study/results/detector_training/yolo26x_samrs_sota_plane_s1024
  sam3_text_output_dir: studies/samrs_sota_plane_study/results/pipelines/sam3_text
  yolo_sam3_output_dir: studies/samrs_sota_plane_study/results/pipelines/yolo26x_sam3
  gt_box_sam3_output_dir: studies/samrs_sota_plane_study/results/pipelines/gt_box_sam3
  sam3_hybrid_yolo_output_dir: studies/samrs_sota_plane_study/results/pipelines/sam3_hybrid_yolo_bbox
  yolo_sam2_output_dir: studies/samrs_sota_plane_study/results/pipelines/yolo26x_sam2
  gt_box_sam2_output_dir: studies/samrs_sota_plane_study/results/pipelines/gt_box_sam2
  remotesam_text_output_dir: studies/samrs_sota_plane_study/results/pipelines/remotesam_text
  gt_box_ringmo_sam_output_dir: studies/samrs_sota_plane_study/results/pipelines/gt_box_ringmo_sam
  yolo_ringmo_sam_output_dir: studies/samrs_sota_plane_study/results/pipelines/yolo26x_ringmo_sam
  sam1_gt_box_output_dir: studies/samrs_sota_plane_study/results/pipelines/gt_box_sam1
  sam1_yolo_output_dir: studies/samrs_sota_plane_study/results/pipelines/yolo26x_sam1
  sam3_triplet_metrics_dir: studies/samrs_sota_plane_study/results/pipelines/metrics
  sam3_triplet_visualizations_dir: studies/samrs_sota_plane_study/results/pipelines/visualizations

yolo:
  base_weights: models/yolo/yolo26x.pt
  trained_weights: studies/samrs_sota_plane_study/results/detector_training/yolo26x_samrs_sota_plane_s1024/train/weights/best.pt
  imgsz: 1024
  batch: 12
  epochs: 20
  patience: 30
  conf: 0.20
  iou: 0.70
  max_det: 500
  workers: 4
  device: 0

sam3:
  backend: local
  local_model_dir: models/sam3_hf
  prompt: plane
  output_prob_thresh: 0.5
  mask_threshold: 0.5
  device: 0
  torch_dtype: float32
  endpoint: https://serverless.roboflow.com/sam3/concept_segment
  model_id: sam3/sam3_final

sam2:
  model_id: facebook/sam2.1-hiera-large
  device: 0
  torch_dtype: float32
  mask_threshold: 0.0
  box_batch_size: 16

sam1:
  model_id: facebook/sam-vit-huge
  device: 0
  torch_dtype: float32
  mask_threshold: 0.0
  box_batch_size: 16

remotesam_text:
  external_root: external_models/RemoteSAM
  checkpoint_path: models/remotesam_hf/RemoteSAMv1.pth
  prompts:
    - airplane
    - aircraft
    - plane
  prob_threshold: 0.1
  use_epoc: false
  device: 0

ringmo_sam:
  model_root: models/ringmo_sam_hf
  config_path: models/ringmo_sam_hf/configs/fine_tuning_one_decoder.yaml
  checkpoint_path: models/ringmo_sam_hf/save/model_epoch_last.pth
  device: cuda:0
  normalize: true
  class_ids:
    - 5

evaluation:
  positive_only: true
  stratify_by: mask_area
  min_objects_per_image: 1
  max_objects_per_image: 500
  low_object_count_max: 5
  high_object_count_min: 20
  overlap_iou_threshold: 0.0
  no_overlap_iou_max: 0.0
  overlap_iou_min: 0.001
  area_threshold: median
  max_per_stratum: 128
  balance_to_smallest_stratum: true
  max_visualizations: 24
  max_visualizations_per_stratum: 4

report:
  output_dir: studies/samrs_sota_plane_study/reports
  title: SAMRS SOTA Plane Segmentation Metric Report
  language: tr
